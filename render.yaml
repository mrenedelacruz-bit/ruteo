# Blueprint de Render (https://render.com/docs/infrastructure-as-code).
# Despliega un servicio web (API + frontend compilado, un solo origen) y
# una base de datos Postgres con PostGIS. Ver "Despliegue de demo" en el
# README para el enlace de un clic y que campos hay que completar.

databases:
  - name: ruteo-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: ruteo-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ruteo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEOCODE_USER_AGENT
        value: ruteo-demo-app
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
