# Definición del proyecto para XcodeGen (`brew install xcodegen && xcodegen generate`).
#
# Se versiona este YAML en vez del .xcodeproj a propósito: el pbxproj genera
# conflictos de merge irresolubles en cuanto trabajan dos personas a la vez.

name: PropiedadesNFC

options:
  bundleIdPrefix: app.upgh
  deploymentTarget:
    iOS: "17.0"          # SwiftData y la API de Map con MapContentBuilder exigen 17
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""   # ← rellenar con el Team ID; sin él no se firma el entitlement NFC

targets:
  PropiedadesNFC:
    type: application
    platform: iOS
    sources:
      - path: Fuentes
        excludes:
          - "Recursos/Info.plist"
          - "Recursos/PropiedadesNFC.entitlements"
    settings:
      base:
        INFOPLIST_FILE: Fuentes/Recursos/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fuentes/Recursos/PropiedadesNFC.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: app.upgh.propiedadesnfc
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Fuentes/Recursos/PropiedadesNFC.entitlements

  PropiedadesNFCTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Pruebas]
    dependencies:
      - target: PropiedadesNFC
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PropiedadesNFC:
    build:
      targets:
        PropiedadesNFC: all
        PropiedadesNFCTests: [test]
    test:
      targets: [PropiedadesNFCTests]
      gatherCoverageData: true
